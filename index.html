<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#243E6B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="YB노트" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap" />
  <title>YB-EverNote</title>
</head>
<body class="signed-out">
  <div id="app" class="app" data-view="list">
    <!-- 1열: 폴더 -->
    <aside class="pane pane-folders" aria-label="폴더">
      <header class="pane-head">
        <span class="brand">YB-EverNote</span>
      </header>
      <nav id="folder-nav" class="folder-nav"></nav>
      <footer class="pane-foot"><span id="sync" class="sync" data-s="pending">● 연결 중…</span><span id="account" class="account"></span><button class="btn-settings" id="btn-settings" title="설정">⚙ 설정</button><span><span id="version"></span><span id="usage"></span></span></footer>
    </aside>
    <div class="scrim" data-go="list"></div>

    <!-- 2열: 노트 목록 -->
    <section class="pane pane-list" aria-label="노트 목록">
      <header class="pane-head">
        <button class="icon-btn only-narrow" data-go="folders" aria-label="폴더 보기">☰</button>
        <h1 id="list-title">모든 노트</h1>
        <button class="btn-primary" id="btn-new">＋ 새 노트</button>
      </header>
      <div class="search-box">
        <input id="search" type="search" placeholder="제목 검색" />
      </div>
      <ul id="note-list" class="note-list"></ul>
    </section>

    <!-- 3열: 편집 -->
    <main class="pane pane-editor" aria-label="노트 편집">
      <header class="pane-head">
        <button class="icon-btn only-mobile" data-go="list" aria-label="목록으로">‹</button>
        <input id="note-title" class="title-input" placeholder="제목" disabled />
        <span id="save-state" class="save-state"></span>
        <button class="icon-btn" id="btn-fav" title="즐겨찾기" disabled>☆</button>
        <select id="sel-tag" class="sel-move sel-tag" title="해시태그로 노트 골라 보기 (제목에 #단어)"></select>
        <select id="sel-bg" class="sel-move sel-bg" title="노트 배경" disabled>
          <option value="lined">줄노트</option>
          <option value="blank">무지</option>
          <option value="grid">모눈</option>
        </select>
        <select id="sel-move" class="sel-move" title="폴더 이동" disabled></select>
        <button class="icon-btn" id="btn-delete" title="휴지통으로" disabled>🗑</button>
      </header>
      <div class="toolbar" id="toolbar" aria-label="도구 모음">
        <select id="sel-font" title="글꼴"></select>
        <select id="sel-size" title="글자 크기"></select>
        <span class="sep"></span>
        <button class="tool" data-cmd="bold" title="굵게 (Ctrl+B)"><b>B</b></button>
        <button class="tool" data-cmd="italic" title="기울임 (Ctrl+I)"><i>I</i></button>
        <button class="tool" data-cmd="underline" title="밑줄 (Ctrl+U)"><u>U</u></button>
        <button class="tool" data-cmd="strike" title="취소선"><s>S</s></button>
        <span class="sep"></span>
        <button class="tool" data-cmd="h1" title="큰 제목">H1</button>
        <button class="tool" data-cmd="h2" title="작은 제목">H2</button>
        <button class="tool" data-cmd="bullet" title="글머리 목록">•</button>
        <button class="tool" data-cmd="ordered" title="번호 목록">1.</button>
        <button class="tool" data-cmd="task" title="체크박스">☑</button>
        <span class="sep"></span>
        <span id="hl-group" class="hl-group" title="형광펜"></span>
        <span class="sep"></span>
        <button class="tool" data-cmd="drawing" title="필기 넣기 (펜·손가락으로 쓰기)">✒</button>
        <button class="tool" data-cmd="image" title="그림 넣기 (붙여넣기·끌어놓기도 가능)">🖼</button>
        <input id="file-image" type="file" accept="image/*" multiple hidden />
        <span class="sep"></span>
        <button class="tool" data-cmd="undo" title="실행 취소 (Ctrl+Z)">↶</button>
        <button class="tool" data-cmd="redo" title="다시 실행 (Ctrl+Y)">↷</button>
      </div>
      <div class="editor-wrap">
        <div id="editor" class="editor" hidden></div>
        <div id="empty-state" class="placeholder">
          <p class="ph-title">노트를 선택하거나 새로 만드세요</p>
          <p>왼쪽 목록에서 노트를 고르거나 <b>＋ 새 노트</b>를 누르세요.</p>
        </div>
      </div>
    </main>
  </div>
  <div id="login" class="login">
    <div class="login-card">
      <img src="icons/icon-192.png" alt="" width="72" height="72" />
      <h2>YB-EverNote</h2>
      <p>Google 계정으로 로그인하면<br />PC·태블릿·휴대폰에서 같은 노트를 쓸 수 있습니다.</p>
      <button id="btn-signin" class="btn-primary btn-signin">Google 계정으로 로그인</button>
      <p id="login-msg" class="login-msg"></p>
    </div>
  </div>
  <dialog id="settings" class="settings">
    <form method="dialog">
      <h3>설정</h3>
      <fieldset>
        <legend>필기 종이 형태 <small>(새로 넣는 필기 블록부터 적용)</small></legend>
        <label><input type="radio" name="paper" value="infinite" /> 세로로 무한히 늘어남</label>
        <label><input type="radio" name="paper" value="a4" /> A4 쪽 단위</label>
      </fieldset>
      <fieldset>
        <legend>타이핑 기본 배경 <small>(새 노트부터 적용, 노트마다 바꿀 수 있음)</small></legend>
        <label><input type="radio" name="textBackground" value="lined" /> 줄노트</label>
        <label><input type="radio" name="textBackground" value="blank" /> 무지</label>
        <label><input type="radio" name="textBackground" value="grid" /> 모눈</label>
      </fieldset>
      <fieldset>
        <legend>필기 기본 배경 <small>(블록마다 바꿀 수 있음)</small></legend>
        <label><input type="radio" name="background" value="lined" /> 줄노트</label>
        <label><input type="radio" name="background" value="blank" /> 무지</label>
        <label><input type="radio" name="background" value="grid" /> 모눈</label>
      </fieldset>
      <fieldset>
        <legend>계정</legend>
        <div class="account-row"><span id="account-email"></span><button type="button" class="btn-text danger" id="btn-signout">로그아웃</button></div>
      </fieldset>
      <div class="dlg-actions">
        <button value="cancel" class="btn-text">취소</button>
        <button value="save" class="btn-primary">저장</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
