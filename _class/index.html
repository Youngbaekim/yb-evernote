<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>강의 노트 열기</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f5f7; color: #222; font-family: Pretendard, 'Noto Sans KR', sans-serif; }
  form { width: min(360px, calc(100vw - 32px)); padding: 28px 24px; background: #fff; border: 1px solid #e3e6ea; border-radius: 14px; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
  h1 { margin: 0 0 6px; font-size: 20px; color: #243e6b; }
  p { margin: 0 0 16px; font-size: 14px; color: #6b7480; }
  input { box-sizing: border-box; width: 100%; padding: 12px; font-size: 20px; text-align: center; border: 1px solid #cfd5dc; border-radius: 10px; font-family: ui-monospace, Consolas, monospace; text-transform: lowercase; }
  button { margin-top: 12px; width: 100%; padding: 12px; font-size: 16px; font-weight: 700; color: #fff; background: #243e6b; border: 0; border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>
<form id="f">
  <h1>강의 노트 열기</h1>
  <p>강사가 알려 준 코드를 입력하세요.</p>
  <input id="c" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="예: kcce" autofocus />
  <button>열기</button>
</form>
<script>
  document.getElementById('f').onsubmit = function (e) {
    e.preventDefault();
    var c = document.getElementById('c').value.trim().toLowerCase().replace(/\s+/g, '-');
    if (c) location.href = '/class/' + encodeURIComponent(c);
  };
</script>
</body>
</html>
